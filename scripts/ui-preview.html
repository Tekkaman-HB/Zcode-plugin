<!DOCTYPE html>
<!--
[INPUT]: /out/webview/styles.css 与 ui-live.html 的真实产物场景
[OUTPUT]: 四主题切换、聊天/空态/权限/问答场景、三栏并排验收
[POS]: scripts/ 的人工 UI 验收入口；不再维护与产品脱节的静态组件副本
[PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCode · Codex 界面验收</title>
<link rel="stylesheet" href="/out/webview/styles.css">
<style>
body{display:flex;flex-direction:column;overflow:hidden}
#harness{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;flex:none}
#harness strong{margin-right:auto;font-weight:500}
#harness button,#scene{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);color:var(--ink);cursor:pointer}
#harness button[aria-pressed=true]{border-color:var(--focus)}
#frames{display:flex;flex:1;min-height:0}
.preview-cell{display:flex;flex:1;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.preview-cell>span{padding:5px 12px;font-size:11px;color:var(--ink-3)}
iframe{flex:1;min-height:0;width:100%;border:0}
</style>
</head>
<body>
<header id="harness">
<strong>ZCode · Codex 插件复刻验收</strong>
<button data-theme="light">亮色</button><button data-theme="dark">暗色</button>
<button data-theme="hc">高对比</button><button data-theme="hclight">高对比亮</button>
<select id="scene" aria-label="界面状态"><option value="chat">聊天</option><option value="empty">空态</option><option value="permission">权限确认</option><option value="question">问题向导</option></select>
<button id="cmp" aria-pressed="false">并排对比</button>
</header>
<main id="frames"></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  let theme = params.get('theme') || 'light';
  let compare = false;
  const classes = { light: '', dark: 'vscode-dark', hc: 'vscode-high-contrast', hclight: 'vscode-high-contrast-light' };
  const labels = { light: '亮色', dark: '暗色', hc: '高对比', hclight: '高对比亮' };
  const render = () => {
    document.body.className = classes[theme] || '';
    document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === theme)));
    document.getElementById('cmp').setAttribute('aria-pressed', String(compare));
    const frames = document.getElementById('frames');
    frames.replaceChildren();
    const scene = document.getElementById('scene').value;
    for (const th of compare ? ['light', 'dark', 'hc'] : [theme]) {
      const cell = document.createElement('section');
      cell.className = 'preview-cell';
      const label = document.createElement('span');
      label.textContent = labels[th];
      const frame = document.createElement('iframe');
      frame.title = 'ZCode ' + labels[th] + '真实界面';
      frame.src = '/scripts/ui-live.html?harness=0&theme=' + th + '&scene=' + (scene === 'empty' ? 'empty' : 'chat');
      frame.addEventListener('load', () => {
        if (scene === 'permission' || scene === 'question') frame.contentWindow.__fixture[scene]();
      });
      cell.append(label, frame);
      frames.append(cell);
    }
  };
  document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => { theme = b.dataset.theme; render(); }));
  document.getElementById('cmp').addEventListener('click', () => { compare = !compare; render(); });
  document.getElementById('scene').addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
