<!DOCTYPE html>
<!--
[INPUT]: /out/webview 真实构建产物与 ./ui-fixtures.js
[OUTPUT]: 支持主题、空态和 CSP 场景的真实 UI 预览，无 CLI/网络副作用
[POS]: scripts/ 的产物驱动页；ui-preview 和 theme-check 共用
[PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(() => {
  const mode = new URLSearchParams(location.search).get('csp');
  if (!mode) return;
  const meta = document.createElement('meta');
  meta.httpEquiv = 'Content-Security-Policy';
  meta.content = "default-src 'none'; style-src 'self'" + (mode === 'fixed' ? " 'unsafe-inline'" : '') +
    "; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'";
  document.head.append(meta);
})();
</script>
<title>ZCode · Codex 插件界面验收</title>
<link rel="stylesheet" href="/out/webview/styles.css">
</head>
<body>
<div id="harness" style="position:fixed;top:42px;right:8px;z-index:999;display:flex;gap:4px;font:11px sans-serif">
<button id="fire-ctx">注入上下文</button><button id="open-ctx">查看上下文</button>
</div>
<div id="app"></div>
<script src="/scripts/ui-fixtures.js"></script>
<script src="/out/webview/main.js"></script>
<script>window.__fixture.start();</script>
</body>
</html>
