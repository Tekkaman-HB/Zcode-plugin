<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- ZCode 官方标识复刻：深色圆角底 + 斜切双段白色 Z（几何对齐桌面端 icon.png） -->
  <rect width="24" height="24" rx="5.4" fill="#18181a"/>
  <g fill="#ffffff">
    <!-- 顶横杠 -->
    <rect x="6.1" y="6.9" width="11.8" height="1.5"/>
    <!-- 底横杠 -->
    <rect x="6.1" y="15.6" width="11.8" height="1.5"/>
    <!-- 主对角（右上 → 左下） -->
    <polygon points="16.4,8.4 17.8,8.4 7.5,15.6 6.1,15.6"/>
  </g>
  <!-- 斜切缝隙（底色覆盖，形成双段 Z） -->
  <polygon points="12.4,4.5 13.2,4.5 12.0,19.5 11.2,19.5" fill="#18181a"/>
</svg>
