<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- ZCode 官方标识复刻：深色圆角底 + 白色双段 Z（几何像素级对齐桌面端 icon.png） -->
  <rect width="24" height="24" rx="5.4" fill="#18181a"/>
  <g fill="#ffffff">
    <!-- 对角带：右端融入顶横杠、左端融入底横杠，中部连续不断 -->
    <polygon points="17.8,6.9 13.3,6.9 6.0,17.0 10.5,17.0"/>
    <!-- 顶横杠左段：右端沿对角方向斜切，与对角带留平行缝隙 -->
    <polygon points="6.4,6.9 12.0,6.9 10.9,8.4 6.4,8.4"/>
    <!-- 底横杠右段：左端沿对角方向斜切 -->
    <polygon points="12.9,15.6 17.5,15.6 17.5,17.0 11.8,17.0"/>
  </g>
</svg>
